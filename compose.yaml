services:
  sbtg2cloud:
    build: .
    image: sbtg2cloud:local
    platform: linux/amd64
    container_name: sbtg2cloud
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    ports:
      - "${BIND_IP:-0.0.0.0}:8080:8080"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # Only Telegram uses the proxy address from .env.
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      # Keep Guangya direct even if Docker/client defaults contain proxy settings.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - ${APPDATA_PATH:-./data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
